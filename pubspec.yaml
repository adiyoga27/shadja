name: shadja
description: "POS App (Restaurant / F&B) - Tablet/mobile POS with Flutter"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0

  # Secure storage (token auth)
  flutter_secure_storage: ^9.2.2

  # Image caching
  cached_network_image: ^3.4.1

  # Icons - using built-in Material Icons (modern, always compatible)
  # Icon & Font
  google_fonts: ^6.2.1

  # Number / date formatting (Rupiah)
  intl: ^0.19.0

  # Printer thermal (ESC/POS via Bluetooth)
  esc_pos_utils_plus: ^2.0.4
  print_bluetooth_thermal: ^1.2.2

  # Utilities
  uuid: ^4.5.1

  # Permissions (Bluetooth runtime request)
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true